<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YberChords</title>
  <meta property="og:site_name" content="YberChords" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="YberChords — Chord Charts for Musicians" />
  <meta property="og:description" content="Build and share chord charts. Available on iPhone and iPad." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }
    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #c9a84c;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      color: #888;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 16px;
      background: #c9a84c;
      color: #0e0e0e;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn-primary:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="app-icon">🎸</div>
    <h1>YberChords</h1>
    <p>Build and share chord charts with your band. Available on iPhone and Mac.</p>
    <a
      class="btn-primary"
      href="https://apps.apple.com/app/yberchords/idPLACEHOLDER"
      target="_blank"
    >
      Download on the App Store
    </a>
  </div>
</body>
</html>
